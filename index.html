<li><p><strong>Risk of partiality.</strong> If care is fundamentally relationship-based, does this justify caring more for people close to you (your family, your community, your caste or religious group) than for distant strangers? This creates a genuine tension with the <strong>impartiality</strong> that fairness — and specifically, a public servant's foundational obligation to treat all citizens equally — demands. This is a serious weakness: unchecked, care ethics could be misused to <em>justify</em> favouritism or nepotism, dressed up as "caring for one's own."</p></li>
<li><p><strong>Less useful for large-scale, impersonal policy decisions</strong>, where you genuinely cannot have a personal "relationship" with millions of citizens simultaneously — you cannot practice Noddings' "engrossment" toward an entire population when setting national tax policy, for instance.</p></li>
<li><p><strong>Vague on how to weigh competing cares</strong> — if a public servant genuinely cares about multiple citizens with conflicting needs, care ethics alone doesn't provide a clear method for resolving that conflict, the way utilitarian calculation or a Kantian universal rule might attempt to.</p></li>
</ol>
<h4 id="s93">How to Use All Four Theories Together</h4>
<div class="table-wrap"><table>

<thead>

<th><strong>Theory</strong></th>
<th><strong>Core Question</strong></th>
<th><strong>Founding Thinker(s)</strong></th>

  if (!p.ready || !tpl){
    return `<div class="wrap page">${head}
      <div class="empty"><p class="scope">${esc(p.scope)}</p><p>Notes for this part haven't been added yet.</p></div>
      <div style="max-width:760px">${pager(i)}</div></div>`;
  }
  const toc = p.toc || [];
  return `<div class="wrap page layout">
    <article>
      ${head}
      ${toc.length ? `<details class="inline-toc"><summary>Contents</summary><div class="list">${tocLinks(toc)}</div></details>` : ""}
      <div class="notes">${tpl.innerHTML}</div>
      ${pager(i)}
    </article>
    ${toc.length ? `<aside class="rail" aria-label="Contents"><div class="rh">Contents</div>${tocLinks(toc)}</aside>` : ""}
  </div>`;
}
function viewPapers(){
  const cards = YEARS.map(y => `<a href="#/papers/${y.year}"><div class="y">${y.year}</div>
    <div class="s${y.ready ? " ready" : ""}">${y.ready ? "Paper added" : "Coming soon"}</div></a>`).join("");
  return `<div class="wrap page">
    <p class="crumb"><a href="#/">Home</a></p>
    <h1 class="title">Past papers</h1>
    <p class="lede">GS Paper IV question papers from 2013, when the paper was introduced, to 2026.</p>
    <div class="years">${cards}</div></div>`;
}
function viewYear(year){
  const y = YEARS.find(v => String(v.year) === year);
  if (!y) return null;
  const tpl = document.getElementById("paper-" + year);
  const body = (y.ready && tpl) ? `<div class="notes">${tpl.innerHTML}</div>`
    : `<div class="empty"><p>The ${year} paper hasn't been added yet.</p></div>`;
  return `<div class="wrap page"><p class="crumb"><a href="#/papers">Past papers</a></p>
    <h1 class="title">GS Paper IV, ${year}</h1>${body}</div>`;
}

/* ---------- router ---------- */
let heads = [];
function render(){
  let route = location.hash.replace(/^#\/?/, "");
  let jump = null, html = null;
  if (route === "" || route === "home"){ route = "home"; html = viewHome(); }
  else if (route === "syllabus") html = viewSyllabus();
  else if (route.startsWith("notes/")){
    const [id, sec] = route.slice(6).split("/");
    route = "notes/" + id; jump = sec || null;
    html = viewNotes(id);
  }
  else if (route === "papers") html = viewPapers();
  else if (route.startsWith("papers/")) html = viewYear(route.slice(7));
  if (html === null){ route = "home"; html = viewHome(); }
  main.innerHTML = html;

  document.querySelectorAll(".links > a").forEach(a => a.classList.toggle("on", a.dataset.r === route || (a.dataset.r === "papers" && route.startsWith("papers"))));
  let inTopic = false;
  document.querySelectorAll("#ddMenu a").forEach(a => { const on = a.dataset.r === route; a.classList.toggle("on", on); if (on) inTopic = true; });
  $("#ddBtn").classList.toggle("on", inTopic);
  closeMenus();

  const t = main.querySelector("h1.title");
  document.title = (t ? t.textContent + " — " : "") + "Ethics, Integrity and Aptitude — Notes by Mukul Jakhar";

  main.querySelectorAll("a[data-target]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); goTo(a.dataset.target);
    const d = a.closest("details"); if (d) d.open = false;
  }));
  heads = Array.from(main.querySelectorAll(".notes h2[id], .notes h3[id]"));
  if (jump && document.getElementById(jump)) requestAnimationFrame(() => goTo(jump, true));
  else window.scrollTo(0, 0);
  updateBar(); markCurrent();
}
function goTo(id, instant){
  const el = document.getElementById(id);
  if (!el) return;
  const smooth = !instant && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior: smooth ? "smooth" : "auto"});
}
function markCurrent(){
  if (!heads.length) return;
  let cur = heads[0].id;
  for (const h of heads){ if (h.getBoundingClientRect().top < 150) cur = h.id; else break; }
  main.querySelectorAll(".rail a").forEach(a => a.classList.toggle("cur", a.dataset.target === cur));
}
function updateBar(){
  const bar = $("#pbar");
  if (!main.querySelector(".notes")){ bar.style.width = "0"; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
}
addEventListener("scroll", () => { updateBar(); markCurrent(); }, {passive:true});

/* ---------- menus ---------- */
function closeMenus(){
  document.body.classList.remove("menu-open"); $("#menuBtn").setAttribute("aria-expanded","false");
  $("#dd").classList.remove("open"); $("#ddBtn").setAttribute("aria-expanded","false");
}
$("#menuBtn").addEventListener("click", () => {
  const open = document.body.classList.toggle("menu-open");
  $("#menuBtn").setAttribute("aria-expanded", String(open));
});
$("#ddBtn").addEventListener("click", e => {
  e.stopPropagation();
  const open = $("#dd").classList.toggle("open");
  $("#ddBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => { if (!e.target.closest("#dd")) { $("#dd").classList.remove("open"); $("#ddBtn").setAttribute("aria-expanded","false"); } });
addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });

/* ---------- theme ---------- */
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function setThemeLabel(){ $("#themeBtn").textContent = isDark() ? "Light mode" : "Dark mode"; }
try { const s = localStorage.getItem("gs4-theme"); if (s) document.documentElement.dataset.theme = s; } catch(e){}
$("#themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("gs4-theme", next); } catch(e){}
  setThemeLabel();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", setThemeLabel);
setThemeLabel();

addEventListener("hashchange", render);
render();
</script>
</body>
</html>
